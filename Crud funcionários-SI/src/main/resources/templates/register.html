<!doctype html>
<html lang="pt" class="dark scroll-smooth" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGF | Criar conta</title>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = { darkMode: 'class', theme: { extend: { colors: { navy: '#07111F', midnight: '#0B1220', primary: '#3B82F6', premium: '#7C3AED' } } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/soft-ui.css}">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script th:src="@{/js/dashboard.js}" defer></script>
</head>
<body class="premium-shell min-h-screen text-slate-50" th:attr="data-page-message=${message},data-page-message-type=${messageType}">
<header class="public-header reveal-down">
    <a href="/" class="brand-lockup">
        <span class="brand-emblem"><i data-lucide="sparkles"></i></span>
        <span><strong>SGF</strong><small>Novo acesso</small></span>
    </a>
    <a href="/login" class="btn-secondary">Login</a>
</header>

<main class="mx-auto grid min-h-[calc(100vh-96px)] max-w-6xl items-center px-5 pb-12">
    <section class="auth-shell glass-card reveal-up">
        <aside class="auth-visual register-visual">
            <span class="premium-kicker">Nova conta</span>
            <h1>Crie o acesso administrativo.</h1>
            <p>Depois de entrar, cadastre departamentos e vincule funcionarios a cada unidade da organizacao.</p>
            <div class="auth-signal">
                <span><i data-lucide="user-round-plus"></i></span>
                <p>Conta criada com senha criptografada.</p>
            </div>
        </aside>

        <div class="auth-form">
            <span class="premium-kicker">Criar conta</span>
            <h2>Acesso ao SGF</h2>
            <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="mt-7 space-y-4">
                <label class="field-label">Nome completo<input class="field-input" th:field="*{name}" required></label>
                <label class="field-label">Email<input class="field-input" type="email" th:field="*{email}" required></label>
                <label class="field-label">Senha<input class="field-input" type="password" th:field="*{password}" minlength="6" required></label>
                <button class="btn-primary w-full justify-center" type="submit">Criar conta</button>
            </form>
            <p class="mt-6 text-center text-sm text-slate-400">
                Ja tem conta?
                <a class="font-semibold text-blue-300 transition hover:text-white" href="/login">Entrar</a>
            </p>
        </div>
    </section>
</main>

<section id="messageModal" class="modal" aria-hidden="true">
    <div class="modal-card">
        <button type="button" class="modal-close" data-close-modal aria-label="Fechar"><i data-lucide="x"></i></button>
        <div class="modal-symbol info"><i data-lucide="info"></i></div>
        <h3 class="modal-title">Revise os dados</h3>
        <p id="messageText" class="modal-copy"></p>
    </div>
</section>
</body>
</html>

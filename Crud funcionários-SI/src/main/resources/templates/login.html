<!doctype html>
<html lang="pt" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGF | Login</title>
    <script>
        (() => {
            try {
                document.documentElement.classList.toggle('dark', localStorage.getItem('si-theme') === 'dark');
            } catch (error) {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = { darkMode: 'class', theme: { extend: { colors: { navy: '#07111F', midnight: '#0B1220', primary: '#3B82F6', premium: '#7C3AED' } } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/soft-ui.css}">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script th:src="@{/js/dashboard.js}" defer></script>
</head>
<body class="premium-shell min-h-screen text-slate-50" th:attr="data-page-message=${message},data-page-message-type=${messageType}">
<header class="public-header reveal-down">
    <a href="/" class="brand-lockup">
        <span class="brand-emblem"><i data-lucide="users-round"></i></span>
        <span><strong>SGF</strong><small>Acesso seguro</small></span>
    </a>
    <button type="button" id="themeToggle" class="icon-glass" aria-label="Alternar modo"><i data-lucide="moon"></i></button>
</header>

<main class="mx-auto grid min-h-[calc(100vh-96px)] max-w-6xl items-center px-5 pb-12">
    <section class="auth-shell glass-card reveal-up">
        <aside class="auth-visual">
            <span class="premium-kicker">Sessao protegida</span>
            <h1>Entre para gerir pessoas com precisao.</h1>
            <p>O painel combina funcionarios, departamentos e folha salarial numa experiencia corporativa premium.</p>
            <div class="auth-signal">
                <span><i data-lucide="shield-check"></i></span>
                <p>Autenticacao segura com sessao Spring Security.</p>
            </div>
        </aside>

        <div class="auth-form">
            <span class="premium-kicker">Login</span>
            <h2>Bem-vindo de volta</h2>
            <form id="loginForm" th:action="@{/login}" method="post" class="mt-7 space-y-4" autocomplete="off" data-clear-on-load>
                <label class="field-label">Email<input class="field-input" type="email" name="email" value="" autocomplete="off" autocapitalize="none" spellcheck="false" required></label>
                <label class="field-label">Senha
                    <span class="password-control">
                        <input class="field-input" type="password" name="password" value="" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" data-password-toggle aria-label="Mostrar senha"><i data-lucide="eye"></i></button>
                    </span>
                </label>
                <button class="btn-primary w-full justify-center" type="submit">Entrar</button>
            </form>
            <p class="mt-6 text-center text-sm text-slate-400">
                Ainda nao tem conta?
                <a class="font-semibold text-blue-300 transition hover:text-white" href="/register">Criar conta</a>
            </p>
        </div>
    </section>
</main>

<section id="messageModal" class="modal" aria-hidden="true">
    <div class="modal-card">
        <button type="button" class="modal-close" data-close-modal aria-label="Fechar"><i data-lucide="x"></i></button>
        <div class="modal-symbol info"><i data-lucide="info"></i></div>
        <h3 class="modal-title">Atencao</h3>
        <p id="messageText" class="modal-copy"></p>
    </div>
</section>
</body>
</html>
